<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" role="img" aria-label="株式会社モモヤシステム">
  <defs>
    <linearGradient id="momoyaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e5a9f"/>
      <stop offset="100%" stop-color="#0c2545"/>
    </linearGradient>
  </defs>
  <!-- Mark: あいだに立つ「I」字 -->
  <g transform="translate(8 8)">
    <rect x="0"  y="0"  width="48" height="48" rx="2" fill="url(#momoyaGrad)"/>
    <!-- 左の上流 -->
    <rect x="6"  y="14" width="10" height="6" fill="#cfdff3"/>
    <!-- 中央のモモヤ（「あいだ」） -->
    <rect x="20" y="6"  width="8"  height="36" fill="#ffffff"/>
    <rect x="22" y="22" width="4"  height="4"  fill="#d97706"/>
    <!-- 右の下流 -->
    <rect x="32" y="28" width="10" height="6" fill="#cfdff3"/>
    <!-- 矢印（左→中央） -->
    <path d="M 16 17 L 19 17 L 19 16 L 20 17 L 19 18 L 19 17" fill="#cfdff3"/>
    <!-- 矢印（中央→右） -->
    <path d="M 28 31 L 31 31 L 31 30 L 32 31 L 31 32 L 31 31" fill="#cfdff3"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(72 0)" font-family="'Noto Serif JP','Yu Mincho',serif" fill="#0d1218">
    <text x="0" y="34" font-size="22" font-weight="900" letter-spacing="0.04em">モモヤシステム</text>
    <text x="0" y="54" font-size="10" fill="#5a6473" font-family="'Montserrat',sans-serif" letter-spacing="0.3em">MOMOYA SYSTEM</text>
  </g>
</svg>
