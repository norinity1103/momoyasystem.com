name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # [[R007]] npm ci は macOS lockfile の platform 差異で落ちうるため --ignore-scripts
      - run: npm install --ignore-scripts
      - uses: actions/configure-pages@v5
        id: pages
      # Vercel adapter 同梱ビルドで dist/client に静的成果物を生成（[[R004]] 移行期）
      - run: DEPLOY_TARGET=vercel npx astro build
        env:
          PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
